    "region": "global",
    "regionText": "全球线上",
    "status": "🔄 季节性滚动推进",
    "statusType": "upcoming",
    "deadline": "季节性全球线上赛 (秋冬季新赛季筹备中)",
    "deadlineTag": "📌 开源新赛季规则即将发布",
    "deadlineUrgent": false,
    "timelineDetails": "每年夏季与冬季开展全球线上黑客松 ｜ 汇聚全球数万开源开发者",
    "prizes": "$11,000+ 现金奖池 ｜ 赞助商模型 API 算力卡包 ｜ Hugging Face 首页全球置顶推荐",
    "prizeBreakdown": "优胜项目获现金奖励；Anthropic/Mistral/SambaNova 免费 API 额度包；Spaces 精选专区曝光",
    "prizeScore": 11000,
    "incentives": [
      "cash",
      "compute"
    ],
    "formats": [
      "agent"
    ],
    "specs": "基于开源模型或 MCP (Model Context Protocol) 标准协议；必须在 HF Spaces (Gradio) 上线",
    "requirements": "基于开源模型或 MCP 协议；必须在 HF Spaces (Gradio) 上线",
    "aiRatio": "使用 smolagents、LangGraph 或标准化 MCP 协议构建的多 Agent 协同系统",
    "deliverables": "Hugging Face Spaces 部署链接 + GitHub 开源代码仓库 + 详细使用与架构说明文档",
    "evalCriteria": "开源生态复用价值 (35%)、MCP 协议规范性 (35%)、Spaces 交互体验与代码可复现性 (30%)",
    "proTips": "HF 社区极其看重开源共享与可复现性；提供一键运行的 Spaces Demo 和详尽的 README.md 是获取高赞与评委高分的核心套路。",
    "searchKeywords": "HuggingFace Hugging Face 抱抱脸 MCP Agent 开源 黑客松",
    "link": "https://huggingface.co/Agents-MCP-Hackathon"
  }
];

// Active Filter State
const state = {
    category: 'all',
    region: 'all',
    status: 'all',
    incentive: 'all',
    format: 'all',
    search: '',
    sortBy: 'default',
    viewMode: 'grid'
};

function initFilters() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const filterType = this.getAttribute('data-filter');
            const filterVal = this.getAttribute('data-val');
            
            // Toggle active state in this row
            const parentRow = this.closest('.filter-buttons');
            parentRow.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            
            state[filterType] = filterVal;
            applyFilters();
        });
    });
}

function handleSearch() {
    state.search = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    applyFilters();
}

function handleSort() {
    state.sortBy = document.getElementById('sortSelect').value;
    applyFilters();
}

function switchView(mode) {
    state.viewMode = mode;
    document.getElementById('viewCardBtn').classList.toggle('active', mode === 'grid');
    document.getElementById('viewTableBtn').classList.toggle('active', mode === 'table');
    document.getElementById('competitionsGrid').style.display = mode === 'grid' ? 'grid' : 'none';
    document.getElementById('competitionsTableWrap').style.display = mode === 'table' ? 'block' : 'none';
}

function resetAllFilters() {
    state.category = 'all';
    state.region = 'all';
    state.status = 'all';
    state.incentive = 'all';
    state.format = 'all';
    state.search = '';
    state.sortBy = 'default';
    
    document.getElementById('searchInput').value = '';
    document.getElementById('sortSelect').value = 'default';
    
    document.querySelectorAll('.filter-buttons').forEach(row => {
        row.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-val') === 'all');
        });
    });
    
    applyFilters();
}

function applyFilters() {
    let filtered = rawCompetitions.filter(c => {
        // Status Strict Match
        if (state.status !== 'all' && c.statusType !== state.status) return false;
        // Category Match
        if (state.category !== 'all' && c.category !== state.category) return false;
        // Region Match
        if (state.region !== 'all' && c.region !== state.region) return false;
        // Incentive Match
        if (state.incentive !== 'all' && (!c.incentives || !c.incentives.includes(state.incentive))) return false;
        // Format Match
        if (state.format !== 'all' && (!c.formats || !c.formats.includes(state.format))) return false;
        // Search safe match
        if (state.search) {
            const name = (c.name || '');
            const organizer = (c.organizer || '');
            const requirements = (c.requirements || c.specs || '');
            const prizes = (c.prizes || '');
            const subCategory = (c.subCategory || '');
            const deadline = (c.deadline || '');
            const proTips = (c.proTips || '');
            const specs = (c.specs || '');
            const searchKeywords = (c.searchKeywords || '');
            
            const fullStr = (name + ' ' + organizer + ' ' + requirements + ' ' + prizes + ' ' + subCategory + ' ' + deadline + ' ' + proTips + ' ' + specs + ' ' + searchKeywords).toLowerCase();
            if (!fullStr.includes(state.search)) return false;
        }
        return true;
    });

    // Sort
    if (state.sortBy === 'prize-desc') {
        filtered.sort((a, b) => (b.prizeScore || 0) - (a.prizeScore || 0));
    } else if (state.sortBy === 'ongoing-first') {
        filtered.sort((a, b) => (a.statusType === 'ongoing' ? -1 : 1));
    }

    render(filtered);
}

function render(items) {
    let statusText = '';
    if (state.status === 'ongoing') statusText = ' [已筛选：正在报名中]';
    else if (state.status === 'upcoming') statusText = ' [已筛选：即将开启/常态化]';
    
    document.getElementById('resultsSummary').innerHTML = `共匹配到 <strong>${items.length}</strong> 场符合条件的赛事${statusText}`;

    // Render Cards
    const grid = document.getElementById('competitionsGrid');
    if (items.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">未找到符合当前多维筛选条件的赛事，请点击右上角「↺ 重置所有筛选」后重试。</div>`;
    } else {
        grid.innerHTML = items.map(c => `
            <div class="card">
                <div>
                    <!-- Top Badges -->
                    <div class="card-top">
                        <div class="badges-wrap">
                            <span class="badge badge-${c.category}">${c.categoryLabel}</span>
                            <span class="badge-sub">${c.subCategory}</span>
                            <span class="badge-sub">${c.regionText}</span>
                        </div>
                        <span class="badge-status status-${c.statusType}">${c.status}</span>
                    </div>

                    <!-- Title -->
                    <div class="card-title">${c.name}</div>

                    <!-- Explicit Deadline Highlight Box -->
                    <div class="deadline-box ${c.deadlineUrgent ? 'urgent' : 'normal'}">
                        <div>
                            <div class="deadline-main">⏰ 截止时间：${c.deadline}</div>
                            <div class="timeline-sub">📅 周期节点：${c.timelineDetails}</div>
                        </div>
                        <span class="deadline-tag">${c.deadlineTag}</span>
                    </div>

                    <!-- Core Meta List -->
                    <div class="meta-list">
                        <div class="meta-item">
                            <span class="meta-k">主办平台：</span>
                            <span class="meta-v">${c.organizer}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-k">奖金权益：</span>
                            <span class="meta-v prize-text">${c.prizes}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-k">奖池细分：</span>
                            <span class="meta-v" style="font-size: 12px; color: #475569;">${c.prizeBreakdown || '详见官方章程'}</span>
                        </div>
                    </div>

                    <!-- Enriched Details -->
                    <div class="detail-block">
                        <strong>📐 作品规格与格式：</strong>
                        <div class="detail-text">${c.specs || c.requirements || '见官方细则'}</div>
                    </div>
                    <div class="detail-block">
                        <strong>🤖 AI 使用比例要求：</strong>
                        <div class="detail-text">${c.aiRatio || '深度应用 AIGC 工具'}</div>
                    </div>
                    <div class="detail-block">
                        <strong>📦 必须提交材料：</strong>
                        <div class="detail-text">${c.deliverables || '成片视频 + 创作说明'}</div>
                    </div>
                    <div class="detail-block">
                        <strong>⚖️ 核心评审侧重：</strong>
                        <div class="detail-text">${c.evalCriteria || '综合视听艺术与创意'}</div>
                    </div>

                    <!-- Pro Tips -->
                    <div class="protip-box">
                        <strong>💡 备赛点拨：</strong>${c.proTips || '紧扣官方命题，打磨故事与画质。'}
                    </div>
                </div>

                <!-- Footer Action -->
                <div class="card-footer">
                    <span style="font-size: 11.5px; color: var(--text-muted);">已完成官方信息溯源</span>
                    <a href="${c.link}" target="_blank" class="link-btn">直达官方报名入口 ↗</a>
                </div>
            </div>
        `).join('');
    }

    // Render Table
    const tbody = document.getElementById('competitionsTableBody');
    tbody.innerHTML = items.map(c => `
        <tr>
            <td>
                <span class="badge badge-${c.category}">${c.categoryLabel}</span><br>
                <small style="color: #64748b;">${c.subCategory}</small>
            </td>
            <td>
                <strong>${c.name}</strong><br>
                <small style="color: #16a34a;">${c.status}</small>
            </td>
            <td>
                <strong style="color: #dc2626;">${c.deadline}</strong><br>
                <small style="color: #64748b;">${c.deadlineTag}</small>
            </td>
            <td>${c.organizer}<br><small style="color: #64748b;">${c.regionText}</small></td>
            <td>
                <small><strong>规格：</strong>${c.specs || c.requirements}</small><br>
                <small><strong>AI比例：</strong>${c.aiRatio}</small>
            </td>
            <td>
                <strong class="prize-text">${c.prizes}</strong><br>
                <small style="color: #475569;">${c.prizeBreakdown}</small>
            </td>
            <td><a href="${c.link}" target="_blank" class="link-btn" style="padding: 4px 8px; font-size: 11.5px;">直达 ↗</a></td>
        </tr>
    `).join('');
}

initFilters();
applyFilters();
</script>
</body>
</html>
